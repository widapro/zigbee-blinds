name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-H2 from defaults
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32h2
          idf.py build
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check zigbee2mqtt/working_converter.js
      - run: node --test tests/*.test.cjs
